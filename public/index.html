<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Office</title>
<style>
  :root {
    --ink: #1d2540;
    --paper: #ffffff;
    --read: #4c8dff; --write: #13a58a; --run: #8b5cf6; --wait: #f5a524; --idle: #8a94a6; --off: #8a94a6;
    --done: #2fbf71;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at 50% 40%, #eef3fa 0%, #dfe6f2 70%);
    color: var(--ink);
    font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
  }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  #overlay { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }

  header {
    position: fixed; top: 14px; left: 16px; right: 16px; z-index: 5;
    display: flex; justify-content: space-between; align-items: center; pointer-events: none;
  }
  .brand { font-weight: 800; font-size: 15px; letter-spacing: -.01em; }
  #conn {
    font-size: 12px; font-weight: 700; padding: 5px 11px; border-radius: 999px;
    background: var(--paper); box-shadow: 0 1px 6px rgba(29,37,64,.18); display: flex; gap: 6px; align-items: center;
  }
  #conn i { width: 8px; height: 8px; border-radius: 50%; background: var(--done); }
  #conn.down i { background: #e5484d; }
  #conn.down { color: #b3262b; }

  .legend {
    position: fixed; left: 16px; bottom: 14px; z-index: 5; display: flex; gap: 14px; flex-wrap: wrap;
    font-size: 12px; font-weight: 600; background: rgba(255,255,255,.85); padding: 7px 12px; border-radius: 999px;
    box-shadow: 0 1px 6px rgba(29,37,64,.15);
  }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

  /* ---- 3D 위에 얹는 말풍선, 이름표 ---- */
  .bubble {
    position: relative; display: flex; align-items: center; gap: 7px; max-width: 230px;
    background: var(--paper); border-radius: 999px; padding: 6px 13px 6px 9px; font-size: 12.5px; font-weight: 700;
    box-shadow: 0 2px 8px rgba(29,37,64,.25); white-space: nowrap; transform: translateY(-6px);
  }
  .bubble::after {
    content: ""; position: absolute; left: 50%; bottom: -5px; width: 10px; height: 10px; margin-left: -5px;
    background: var(--paper); transform: rotate(45deg); border-radius: 2px;
  }
  .bubble .dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--idle); box-shadow: 0 0 0 4px rgba(138,148,166,.2); }
  .bubble .txt { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .bubble.member { font-size: 11px; padding: 4px 10px 4px 7px; max-width: 190px; }
  .bubble.member .dot { width: 8px; height: 8px; }
  .bubble.done { background: var(--done); color: #fff; }
  .bubble.done::after { background: var(--done); }
  .bubble.done .dot { background: #fff; box-shadow: none; }

  .tag {
    display: inline-flex; align-items: center; gap: 5px; background: var(--paper); border-radius: 999px;
    padding: 3px 10px 3px 7px; font-size: 11px; font-weight: 700; box-shadow: 0 1px 5px rgba(29,37,64,.22); white-space: nowrap;
  }
  .tag .sw { width: 9px; height: 9px; border-radius: 50%; }
  .tag.member { font-size: 10px; font-weight: 600; opacity: .95; }
  .room {
    background: rgba(255,255,255,.9); border-radius: 999px; padding: 3px 11px; font-size: 12px; font-weight: 800; white-space: nowrap;
  }
  .more { background: var(--ink); color: #fff; border-radius: 999px; padding: 2px 8px; font-size: 11px; font-weight: 800; }
  .alert {
    width: 22px; height: 22px; border-radius: 50%; background: var(--wait); color: #fff; font-weight: 900; font-size: 15px;
    display: grid; place-items: center; box-shadow: 0 2px 6px rgba(29,37,64,.3); animation: blink .9s steps(2) infinite;
  }
  .zzz { font-weight: 800; font-size: 14px; color: #5a6a8f; animation: floatz 2.2s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .2; transform: scale(.85); } }
  @keyframes floatz { 0%, 100% { transform: translateY(0); opacity: .9; } 50% { transform: translateY(-5px); opacity: .5; } }
  @media (prefers-reduced-motion: reduce) { .alert, .zzz { animation: none; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "/vendor/three/build/three.module.js",
  "three/addons/": "/vendor/three/examples/jsm/"
} }
</script>
</head>
<body>
  <div id="stage"><canvas id="c"></canvas><div id="overlay"></div></div>
  <header>
    <div class="brand">Claude Office</div>
    <div id="conn" class="down" role="status"><i></i><span>연결 중…</span></div>
  </header>
  <div class="legend" aria-label="상태 색">
    <span><i style="background:var(--read)"></i>읽는 중</span>
    <span><i style="background:var(--write)"></i>코드 쓰는 중</span>
    <span><i style="background:var(--run)"></i>명령 실행 중</span>
    <span><i style="background:var(--wait)"></i>승인 기다리는 중</span>
    <span><i style="background:var(--idle)"></i>쉬는 중</span>
  </div>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
