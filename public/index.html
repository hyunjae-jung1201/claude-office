<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Office</title>
<link rel="icon" href="data:,">
<style>
  :root {
    color-scheme: dark;
    --ink: #e8ecf8;
    --paper: #1e2640;
    --line: rgba(160,176,230,.18);
    --read: #4c8dff; --write: #13a58a; --run: #8b5cf6; --wait: #2fbf71; --idle: #8a94a6; --off: #8a94a6;
    --done: #2fbf71;
    --roster-w: 288px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at 50% 38%, #1d2440 0%, #0f1424 72%);
    color: var(--ink);
    font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
  }
  #stage { position: fixed; top: 0; right: 0; bottom: 0; left: var(--roster-w); }
  body.roster-off { --roster-w: 0px; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  #overlay { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }

  header {
    position: fixed; top: 14px; left: calc(var(--roster-w) + 16px); right: 16px; z-index: 5;
    display: flex; justify-content: space-between; align-items: center; pointer-events: none;
  }
  .brand { font-weight: 800; font-size: 15px; letter-spacing: -.01em; }
  #conn {
    font-size: 12px; font-weight: 700; padding: 5px 11px; border-radius: 999px;
    background: var(--paper); box-shadow: 0 0 0 1px var(--line), 0 2px 10px rgba(0,0,0,.4); display: flex; gap: 6px; align-items: center;
  }
  #conn i { width: 8px; height: 8px; border-radius: 50%; background: var(--done); }
  #conn.down i { background: #e5484d; }
  #conn.down { color: #ff8a8e; }

  .legend {
    position: fixed; left: calc(var(--roster-w) + 16px); bottom: 14px; z-index: 5; display: flex; gap: 14px; flex-wrap: wrap;
    font-size: 12px; font-weight: 600; background: rgba(30,38,64,.88); padding: 7px 12px; border-radius: 999px;
    box-shadow: 0 0 0 1px var(--line), 0 2px 10px rgba(0,0,0,.35);
  }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

  .head-right { display: flex; gap: 8px; align-items: center; pointer-events: auto; }
  #rp-btn {
    font: inherit; font-size: 12px; font-weight: 700; color: var(--ink); background: var(--paper); border: 0; cursor: pointer;
    padding: 5px 12px; border-radius: 999px; box-shadow: 0 0 0 1px var(--line), 0 2px 10px rgba(0,0,0,.4);
  }
  #rp-btn:hover, #rp-btn[aria-expanded="true"] { background: #2a3558; }
  #rp-btn:focus-visible, .rp-item:focus-visible, .rp-close:focus-visible { outline: 2px solid #8fb2ff; outline-offset: 2px; }
  #rp {
    position: fixed; top: 52px; right: 16px; bottom: 56px; width: min(420px, calc(100vw - 32px)); z-index: 6;
    background: rgba(24,31,54,.96); border-radius: 14px; box-shadow: 0 0 0 1px var(--line), 0 10px 30px rgba(0,0,0,.55);
    display: flex; flex-direction: column; overflow: hidden; font-size: 13px;
  }
  #rp[hidden] { display: none; }
  .rp-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .rp-close { background: none; border: 0; color: var(--ink); font-size: 14px; cursor: pointer; padding: 2px 6px; border-radius: 6px; }
  .rp-notice { padding: 8px 14px; background: rgba(245,165,36,.16); color: #ffd28a; font-weight: 700; }
  .rp-list { overflow: auto; max-height: 45%; padding: 6px; border-bottom: 1px solid var(--line); }
  .rp-detail { overflow: auto; flex: 1; padding: 10px 14px; }
  .rp-muted { color: #9aa6c8; padding: 10px 8px; line-height: 1.5; }
  .rp-item { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; font: inherit; color: var(--ink); background: transparent; border: 0; border-radius: 10px; padding: 8px; cursor: pointer; }
  .rp-item:hover { background: rgba(255,255,255,.06); }
  .rp-icon { flex: none; min-width: 34px; text-align: center; font-weight: 800; }
  .rp-item.ok .rp-icon { color: #4ad58a; } .rp-item.concern .rp-icon { color: #f5a524; } .rp-item.block .rp-icon { color: #ff6b6f; }
  .rp-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .rp-name { font-weight: 700; } .rp-sum { color: #b4bfdc; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rp-time { flex: none; color: #8d99bd; font-size: 11px; }
  .rp-title { font-weight: 800; margin-bottom: 8px; }
  .rp-role { background: rgba(255,255,255,.05); border-radius: 10px; padding: 9px 10px; margin-bottom: 8px; border-left: 3px solid #4ad58a; }
  .rp-role.concern { border-color: #f5a524; } .rp-role.block, .rp-role.failed { border-color: #ff6b6f; }
  .rp-role-head { font-weight: 800; } .rp-summary { color: #c9d3f5; margin: 3px 0 6px; }
  .rp-finding { display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; padding: 4px 0; border-top: 1px solid var(--line); }
  .rp-sev { font-size: 11px; font-weight: 800; padding: 1px 7px; border-radius: 999px; background: #34406a; }
  .rp-finding.major .rp-sev { background: #7a5a16; } .rp-finding.critical .rp-sev { background: #8a2b30; }
  .rp-pre { margin: 6px 0 0; padding: 8px 10px; max-height: 160px; overflow: auto; background: rgba(0,0,0,.3); border-radius: 8px; font-size: 12px; line-height: 1.45; white-space: pre-wrap; word-break: break-word; color: #c9d3f5; }
  .rp-file { color: #8fb2ff; font-size: 12px; } .rp-text { flex-basis: 100%; line-height: 1.5; }

  /* ---- 왼쪽 목록: 아바타 모습 · 이름 · 지금 하는 일 ---- */
  #roster {
    position: fixed; top: 0; left: 0; bottom: 0; width: var(--roster-w); z-index: 7; display: flex; flex-direction: column;
    background: #151a2e; border-right: 1px solid var(--line);
  }
  body.roster-off #roster { display: none; }
  .ro-search { margin: 14px 14px 6px; position: relative; }
  .ro-search svg { position: absolute; left: 11px; top: 50%; width: 15px; height: 15px; margin-top: -7.5px; stroke: #8d99bd; fill: none; stroke-width: 2; stroke-linecap: round; pointer-events: none; }
  .ro-search input {
    width: 100%; font: inherit; font-size: 13px; color: var(--ink); background: #1b2240; border: 1px solid var(--line); border-radius: 10px;
    padding: 9px 12px 9px 33px;
  }
  .ro-search input::placeholder { color: #7f8bb0; }
  .ro-search input:focus-visible { outline: 2px solid #8fb2ff; outline-offset: 1px; }
  .ro-meta { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px 6px 18px; font-size: 12px; font-weight: 700; color: #8d99bd; }
  .ro-reset { font: inherit; font-size: 12px; font-weight: 700; color: #8fb2ff; background: none; border: 0; border-radius: 6px; padding: 2px 6px; cursor: pointer; }
  .ro-reset:hover { background: rgba(143,178,255,.12); }
  .ro-reset:focus-visible, .ro:focus-visible { outline: 2px solid #8fb2ff; outline-offset: 1px; }
  .ro { cursor: pointer; }
  .ro-badge:not(:empty) { cursor: pointer; }
  .tag.hl { background: #ffd166; color: #2a1d00; box-shadow: 0 0 0 2px #ffd166, 0 2px 12px rgba(255,209,102,.6); font-weight: 800; font-size: 11px; padding: 2px 8px 2px 6px; opacity: 1; }
  .tag.hl .sw { width: 7px; height: 7px; }
  .ro-list { list-style: none; margin: 0; padding: 4px 8px 16px; overflow-y: auto; flex: 1; }
  .ro-list.empty::before { content: "찾는 아바타가 없습니다"; display: block; color: #8d99bd; font-size: 13px; padding: 14px 12px; }
  .ro { display: flex; gap: 12px; align-items: center; padding: 9px 10px; border-radius: 12px; min-width: 0; }
  .ro:hover { background: rgba(255,255,255,.05); }
  .ro.team + .ro.team, .ro.sub-end + .ro.team { margin-top: 2px; }
  .ro.member, .ro.role { margin-left: 22px; padding: 6px 10px; border-left: 3px solid var(--team, transparent); border-radius: 4px 12px 12px 4px; }
  .blob {
    position: relative; flex: none; width: 36px; height: 33px; border-radius: 50% 50% 34% 34% / 62% 62% 38% 38%;
    background: linear-gradient(165deg, color-mix(in srgb, var(--c) 45%, #fff), var(--c) 72%);
  }
  .blob svg { position: absolute; inset: 3px 6px 0; width: calc(100% - 12px); height: calc(100% - 3px); }
  .blob svg circle { fill: #1c1230; } .blob svg path { stroke: #1c1230; }
  .ro.member .blob, .ro.role .blob { width: 28px; height: 26px; }
  .blob .st { position: absolute; right: -3px; bottom: -3px; width: 11px; height: 11px; border-radius: 50%; background: var(--st); box-shadow: 0 0 0 2.5px #151a2e; }
  .ro-body { display: flex; flex-direction: column; min-width: 0; flex: 1; gap: 1px; }
  .ro-top { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .ro-name { font-size: 14.5px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ro.member .ro-name, .ro.role .ro-name { font-size: 13px; }
  .ro-text { font-size: 12.5px; color: #98a3c4; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ro.member .ro-text, .ro.role .ro-text { font-size: 12px; }
  .ro-go {
    flex: none; margin-left: auto; font: inherit; font-size: 11px; font-weight: 700; color: #c9d3f5; background: rgba(143,178,255,.14);
    border: 1px solid rgba(143,178,255,.35); border-radius: 999px; padding: 1px 9px; cursor: pointer; opacity: 0; transition: opacity .12s;
  }
  .ro:hover .ro-go, .ro:focus-within .ro-go, .ro-go:focus-visible { opacity: 1; }
  .ro-go:hover { background: rgba(143,178,255,.3); }
  .ro-go:focus-visible { outline: 2px solid #8fb2ff; outline-offset: 1px; }
  .ro-go:disabled { opacity: .5; cursor: progress; }
  @media (hover: none) { .ro-go { opacity: .85; } }
  #view-reset {
    position: fixed; top: 14px; left: calc(50% + var(--roster-w) / 2); transform: translateX(-50%); z-index: 8;
    font: inherit; font-size: 13px; font-weight: 700; color: #1d2440; background: #ffd166; border: 0; border-radius: 999px; padding: 7px 16px;
    cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,.45);
  }
  #view-reset[hidden] { display: none; }
  #view-reset kbd { margin-left: 6px; font: inherit; font-size: 11px; opacity: .65; border: 1px solid rgba(29,36,64,.4); border-radius: 4px; padding: 0 4px; }
  #view-reset:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  /* 아바타 상세 카드 */
  #card {
    position: fixed; z-index: 9; width: 250px; padding: 10px 12px 11px; border-radius: 12px; pointer-events: none;
    background: rgba(27,34,64,.97); box-shadow: 0 0 0 1px var(--line), 0 10px 28px rgba(0,0,0,.55); font-size: 12.5px;
  }
  #card[hidden] { display: none; }
  .cd-head { display: flex; align-items: center; gap: 7px; margin-bottom: 7px; }
  .cd-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .cd-name { font-size: 14px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cd-kind { margin-left: auto; font-size: 10.5px; font-weight: 700; color: #9aa6c8; background: rgba(255,255,255,.07); padding: 1px 7px; border-radius: 999px; flex: none; }
  .cd-now { font-weight: 700; color: var(--ink); padding-left: 9px; border-left: 3px solid var(--st, #8a94a6); line-height: 1.4; }
  .cd-meta { margin: 5px 0 0 12px; color: #98a3c4; font-size: 11.5px; }
  .cd-title { margin: 9px 0 3px; color: #8d99bd; font-size: 11px; font-weight: 700; }
  .cd-recent { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .cd-recent li { display: flex; justify-content: space-between; gap: 10px; color: #b4bfdc; }
  .cd-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cd-ago { flex: none; color: #7f8bb0; font-size: 11px; }
  #toast {
    position: fixed; left: calc(50% + var(--roster-w) / 2); bottom: 64px; transform: translateX(-50%); z-index: 9; max-width: min(520px, calc(100vw - 48px));
    background: #232b4d; color: var(--ink); font-size: 13px; font-weight: 700; padding: 9px 16px; border-radius: 999px;
    box-shadow: 0 0 0 1px var(--line), 0 8px 24px rgba(0,0,0,.5); pointer-events: none; opacity: 0; transition: opacity .18s;
  }
  #toast.show { opacity: 1; }
  .ro-badge { flex: none; font-size: 11px; font-weight: 800; }
  .ro-badge.ok { color: #4ad58a; } .ro-badge.concern { color: #f5a524; } .ro-badge.block { color: #ff6b6f; }
  .ro.off .blob { filter: grayscale(.85) brightness(.7); } .ro.off .ro-name { color: #8d99bd; }
  .ro.wait { background: rgba(47,191,113,.12); box-shadow: inset 3px 0 0 var(--wait); }
  .ro.wait .ro-text { color: #9af0bf; font-weight: 600; }
  .ro.wait .blob .st { animation: pulse 1.2s ease-in-out infinite; }
  .ro.done .ro-text { color: #4ad58a; font-weight: 700; }
  @keyframes pulse { 50% { transform: scale(1.35); opacity: .6; } }
  #ro-btn {
    font: inherit; font-size: 12px; font-weight: 700; color: var(--ink); background: var(--paper); border: 0; cursor: pointer;
    padding: 5px 12px; border-radius: 999px; box-shadow: 0 0 0 1px var(--line), 0 2px 10px rgba(0,0,0,.4);
  }
  #ro-btn:focus-visible { outline: 2px solid #8fb2ff; outline-offset: 2px; }
  @media (max-width: 760px) { :root { --roster-w: 0px; } #roster { display: none; width: min(300px, 86vw); } body.roster-on #roster { display: flex; } }
  @media (prefers-reduced-motion: reduce) { .ro.wait .blob .st { animation: none; } }

  /* 팀장 곁의 판정 배지 */
  .badge { font-size: 12px; font-weight: 800; padding: 2px 8px; border-radius: 999px; background: var(--paper); box-shadow: 0 0 0 1px var(--line), 0 2px 8px rgba(0,0,0,.5); white-space: nowrap; }
  .badge.ok { color: #4ad58a; } .badge.concern { color: #f5a524; } .badge.block { color: #ff6b6f; }

  /* ---- 3D 위에 얹는 말풍선, 이름표 ---- */
  .bubble {
    position: relative; display: flex; align-items: center; gap: 7px; max-width: 230px;
    background: var(--paper); border-radius: 999px; padding: 6px 13px 6px 9px; font-size: 12.5px; font-weight: 700;
    box-shadow: 0 0 0 1px var(--line), 0 3px 12px rgba(0,0,0,.5); white-space: nowrap; margin-bottom: 3px;
  }
  .bubble::after {
    content: ""; position: absolute; left: 50%; bottom: -5px; width: 10px; height: 10px; margin-left: -5px;
    background: var(--paper); transform: rotate(45deg); border-radius: 2px;
  }
  .bubble .dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--idle); box-shadow: 0 0 8px 2px rgba(138,148,166,.35); }
  .bubble .txt { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .bubble.member { font-size: 11px; padding: 4px 10px 4px 7px; max-width: 190px; }
  .bubble.member .dot { width: 8px; height: 8px; }
  .bubble.done { background: var(--done); color: #06210f; }
  .bubble.done::after { background: var(--done); }
  .bubble.done .dot { background: #06210f; box-shadow: none; }

  .tag {
    display: inline-flex; align-items: center; gap: 3px; background: rgba(30,38,64,.82); border-radius: 999px;
    padding: 1px 5px 1px 4px; font-size: 8px; font-weight: 700; line-height: 1.25; box-shadow: 0 0 0 1px var(--line); white-space: nowrap;
    transition: font-size .12s, padding .12s;
  }
  .tag .sw { width: 5px; height: 5px; border-radius: 50%; }
  .tag.member { font-size: 7px; font-weight: 600; padding: 0 4px 0 3px; opacity: .9; }
  .tag.member .sw { width: 4px; height: 4px; }
  .room {
    background: rgba(30,38,64,.82); box-shadow: 0 0 0 1px var(--line); border-radius: 999px; padding: 2px 9px; font-size: 10.5px; font-weight: 800; white-space: nowrap; color: #c9d3f5;
  }
  .room-response { background: rgba(31,74,55,.9); color: #9af0bf; box-shadow: 0 0 0 1px rgba(47,191,113,.5); }
  .more { background: #c9d3f5; color: #11162a; border-radius: 999px; padding: 2px 8px; font-size: 11px; font-weight: 800; }
  .alert {
    width: 22px; height: 22px; border-radius: 50%; background: var(--wait); color: #fff; font-weight: 900; font-size: 15px;
    display: grid; place-items: center; box-shadow: 0 0 12px 2px rgba(47,191,113,.6);
  }
  /* 애니메이션은 안쪽 요소에만: CSS2D가 바깥 요소의 transform으로 위치를 잡기 때문 */
  .alert > b { font-weight: 900; animation: blink .9s steps(2) infinite; }
  .zzz { font-weight: 900; font-size: 17px; color: #b8c6ff; text-shadow: 0 0 6px rgba(120,150,255,.8); }
  .zzz > b { display: inline-block; animation: floatz 2.2s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .2; transform: scale(.85); } }
  @keyframes floatz { 0%, 100% { transform: translateY(0); opacity: .9; } 50% { transform: translateY(-5px); opacity: .5; } }
  @media (prefers-reduced-motion: reduce) { .alert > b, .zzz > b { animation: none; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "/vendor/three/build/three.module.js",
  "three/addons/": "/vendor/three/examples/jsm/"
} }
</script>
</head>
<body>
  <aside id="roster" aria-label="아바타 목록">
    <label class="ro-search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input type="search" placeholder="아바타 찾기" aria-label="아바타 찾기" autocomplete="off">
    </label>
    <div class="ro-meta"><span class="ro-count"></span><button class="ro-reset" type="button">전체 보기</button></div>
    <ul class="ro-list"></ul>
  </aside>
  <button id="view-reset" type="button" hidden>전체 보기 <kbd>Esc</kbd></button>
  <div id="card" hidden></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="stage"><canvas id="c"></canvas><div id="overlay"></div></div>
  <header>
    <div class="brand">Claude Office</div>
    <div class="head-right">
      <button id="ro-btn" type="button" aria-pressed="true">목록</button>
      <button id="rp-btn" type="button" aria-expanded="false" aria-controls="rp">보고서</button>
      <div id="conn" class="down" role="status"><i></i><span>연결 중…</span></div>
    </div>
  </header>
  <aside id="rp" hidden aria-label="검토 보고서">
    <div class="rp-head"><b>검토 보고서</b><button class="rp-close" type="button" aria-label="닫기">✕</button></div>
    <div class="rp-notice" hidden></div>
    <div class="rp-list"></div>
    <div class="rp-detail"></div>
  </aside>
  <div class="legend" aria-label="상태 색">
    <span><i style="background:var(--read)"></i>읽는 중</span>
    <span><i style="background:var(--write)"></i>코드 쓰는 중</span>
    <span><i style="background:var(--run)"></i>명령 실행 중</span>
    <span><i style="background:var(--wait)"></i>응답 필요</span>
    <span><i style="background:var(--idle)"></i>쉬는 중</span>
  </div>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
