<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Office</title>
<link rel="icon" href="data:,">
<style>
  :root {
    color-scheme: dark;
    --ink: #e8ecf8;
    --paper: #1e2640;
    --line: rgba(160,176,230,.18);
    --read: #4c8dff; --write: #13a58a; --run: #8b5cf6; --wait: #2fbf71; --idle: #8a94a6; --off: #8a94a6;
    --done: #2fbf71;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at 50% 38%, #1d2440 0%, #0f1424 72%);
    color: var(--ink);
    font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
  }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  #overlay { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }

  header {
    position: fixed; top: 14px; left: 16px; right: 16px; z-index: 5;
    display: flex; justify-content: space-between; align-items: center; pointer-events: none;
  }
  .brand { font-weight: 800; font-size: 15px; letter-spacing: -.01em; }
  #conn {
    font-size: 12px; font-weight: 700; padding: 5px 11px; border-radius: 999px;
    background: var(--paper); box-shadow: 0 0 0 1px var(--line), 0 2px 10px rgba(0,0,0,.4); display: flex; gap: 6px; align-items: center;
  }
  #conn i { width: 8px; height: 8px; border-radius: 50%; background: var(--done); }
  #conn.down i { background: #e5484d; }
  #conn.down { color: #ff8a8e; }

  .legend {
    position: fixed; left: 16px; bottom: 14px; z-index: 5; display: flex; gap: 14px; flex-wrap: wrap;
    font-size: 12px; font-weight: 600; background: rgba(30,38,64,.88); padding: 7px 12px; border-radius: 999px;
    box-shadow: 0 0 0 1px var(--line), 0 2px 10px rgba(0,0,0,.35);
  }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

  .head-right { display: flex; gap: 8px; align-items: center; pointer-events: auto; }
  #rp-btn {
    font: inherit; font-size: 12px; font-weight: 700; color: var(--ink); background: var(--paper); border: 0; cursor: pointer;
    padding: 5px 12px; border-radius: 999px; box-shadow: 0 0 0 1px var(--line), 0 2px 10px rgba(0,0,0,.4);
  }
  #rp-btn:hover, #rp-btn[aria-expanded="true"] { background: #2a3558; }
  #rp-btn:focus-visible, .rp-item:focus-visible, .rp-close:focus-visible { outline: 2px solid #8fb2ff; outline-offset: 2px; }
  #rp {
    position: fixed; top: 52px; right: 16px; bottom: 56px; width: min(420px, calc(100vw - 32px)); z-index: 6;
    background: rgba(24,31,54,.96); border-radius: 14px; box-shadow: 0 0 0 1px var(--line), 0 10px 30px rgba(0,0,0,.55);
    display: flex; flex-direction: column; overflow: hidden; font-size: 13px;
  }
  #rp[hidden] { display: none; }
  .rp-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .rp-close { background: none; border: 0; color: var(--ink); font-size: 14px; cursor: pointer; padding: 2px 6px; border-radius: 6px; }
  .rp-notice { padding: 8px 14px; background: rgba(245,165,36,.16); color: #ffd28a; font-weight: 700; }
  .rp-list { overflow: auto; max-height: 45%; padding: 6px; border-bottom: 1px solid var(--line); }
  .rp-detail { overflow: auto; flex: 1; padding: 10px 14px; }
  .rp-muted { color: #9aa6c8; padding: 10px 8px; line-height: 1.5; }
  .rp-item { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; font: inherit; color: var(--ink); background: transparent; border: 0; border-radius: 10px; padding: 8px; cursor: pointer; }
  .rp-item:hover { background: rgba(255,255,255,.06); }
  .rp-icon { flex: none; min-width: 34px; text-align: center; font-weight: 800; }
  .rp-item.ok .rp-icon { color: #4ad58a; } .rp-item.concern .rp-icon { color: #f5a524; } .rp-item.block .rp-icon { color: #ff6b6f; }
  .rp-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .rp-name { font-weight: 700; } .rp-sum { color: #b4bfdc; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rp-time { flex: none; color: #8d99bd; font-size: 11px; }
  .rp-title { font-weight: 800; margin-bottom: 8px; }
  .rp-role { background: rgba(255,255,255,.05); border-radius: 10px; padding: 9px 10px; margin-bottom: 8px; border-left: 3px solid #4ad58a; }
  .rp-role.concern { border-color: #f5a524; } .rp-role.block, .rp-role.failed { border-color: #ff6b6f; }
  .rp-role-head { font-weight: 800; } .rp-summary { color: #c9d3f5; margin: 3px 0 6px; }
  .rp-finding { display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; padding: 4px 0; border-top: 1px solid var(--line); }
  .rp-sev { font-size: 11px; font-weight: 800; padding: 1px 7px; border-radius: 999px; background: #34406a; }
  .rp-finding.major .rp-sev { background: #7a5a16; } .rp-finding.critical .rp-sev { background: #8a2b30; }
  .rp-file { color: #8fb2ff; font-size: 12px; } .rp-text { flex-basis: 100%; line-height: 1.5; }

  /* 팀장 곁의 판정 배지 */
  .badge { font-size: 12px; font-weight: 800; padding: 2px 8px; border-radius: 999px; background: var(--paper); box-shadow: 0 0 0 1px var(--line), 0 2px 8px rgba(0,0,0,.5); white-space: nowrap; }
  .badge.ok { color: #4ad58a; } .badge.concern { color: #f5a524; } .badge.block { color: #ff6b6f; }

  /* ---- 3D 위에 얹는 말풍선, 이름표 ---- */
  .bubble {
    position: relative; display: flex; align-items: center; gap: 7px; max-width: 230px;
    background: var(--paper); border-radius: 999px; padding: 6px 13px 6px 9px; font-size: 12.5px; font-weight: 700;
    box-shadow: 0 0 0 1px var(--line), 0 3px 12px rgba(0,0,0,.5); white-space: nowrap; margin-bottom: 3px;
  }
  .bubble::after {
    content: ""; position: absolute; left: 50%; bottom: -5px; width: 10px; height: 10px; margin-left: -5px;
    background: var(--paper); transform: rotate(45deg); border-radius: 2px;
  }
  .bubble .dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--idle); box-shadow: 0 0 8px 2px rgba(138,148,166,.35); }
  .bubble .txt { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .bubble.member { font-size: 11px; padding: 4px 10px 4px 7px; max-width: 190px; }
  .bubble.member .dot { width: 8px; height: 8px; }
  .bubble.done { background: var(--done); color: #06210f; }
  .bubble.done::after { background: var(--done); }
  .bubble.done .dot { background: #06210f; box-shadow: none; }

  .tag {
    display: inline-flex; align-items: center; gap: 5px; background: var(--paper); border-radius: 999px;
    padding: 3px 10px 3px 7px; font-size: 11px; font-weight: 700; box-shadow: 0 0 0 1px var(--line), 0 2px 8px rgba(0,0,0,.45); white-space: nowrap;
  }
  .tag .sw { width: 9px; height: 9px; border-radius: 50%; }
  .tag.member { font-size: 10px; font-weight: 600; opacity: .95; }
  .room {
    background: rgba(30,38,64,.82); box-shadow: 0 0 0 1px var(--line); border-radius: 999px; padding: 3px 11px; font-size: 12px; font-weight: 800; white-space: nowrap; color: #c9d3f5;
  }
  .room-response { background: rgba(31,74,55,.9); color: #9af0bf; box-shadow: 0 0 0 1px rgba(47,191,113,.5); }
  .more { background: #c9d3f5; color: #11162a; border-radius: 999px; padding: 2px 8px; font-size: 11px; font-weight: 800; }
  .alert {
    width: 22px; height: 22px; border-radius: 50%; background: var(--wait); color: #fff; font-weight: 900; font-size: 15px;
    display: grid; place-items: center; box-shadow: 0 0 12px 2px rgba(47,191,113,.6);
  }
  /* 애니메이션은 안쪽 요소에만: CSS2D가 바깥 요소의 transform으로 위치를 잡기 때문 */
  .alert > b { font-weight: 900; animation: blink .9s steps(2) infinite; }
  .zzz { font-weight: 900; font-size: 17px; color: #b8c6ff; text-shadow: 0 0 6px rgba(120,150,255,.8); }
  .zzz > b { display: inline-block; animation: floatz 2.2s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .2; transform: scale(.85); } }
  @keyframes floatz { 0%, 100% { transform: translateY(0); opacity: .9; } 50% { transform: translateY(-5px); opacity: .5; } }
  @media (prefers-reduced-motion: reduce) { .alert > b, .zzz > b { animation: none; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "/vendor/three/build/three.module.js",
  "three/addons/": "/vendor/three/examples/jsm/"
} }
</script>
</head>
<body>
  <div id="stage"><canvas id="c"></canvas><div id="overlay"></div></div>
  <header>
    <div class="brand">Claude Office</div>
    <div class="head-right">
      <button id="rp-btn" type="button" aria-expanded="false" aria-controls="rp">보고서</button>
      <div id="conn" class="down" role="status"><i></i><span>연결 중…</span></div>
    </div>
  </header>
  <aside id="rp" hidden aria-label="검토 보고서">
    <div class="rp-head"><b>검토 보고서</b><button class="rp-close" type="button" aria-label="닫기">✕</button></div>
    <div class="rp-notice" hidden></div>
    <div class="rp-list"></div>
    <div class="rp-detail"></div>
  </aside>
  <div class="legend" aria-label="상태 색">
    <span><i style="background:var(--read)"></i>읽는 중</span>
    <span><i style="background:var(--write)"></i>코드 쓰는 중</span>
    <span><i style="background:var(--run)"></i>명령 실행 중</span>
    <span><i style="background:var(--wait)"></i>응답 필요</span>
    <span><i style="background:var(--idle)"></i>쉬는 중</span>
  </div>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
